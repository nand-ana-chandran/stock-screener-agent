[project]
name = "stock-screener"
version = "0.1.0"
description = "A LangGraph-powered stock screener chat app using Gemini, Streamlit, and Yahoo Finance data"
readme = "README.md"
authors = [
    { name = "Nanda", email = "nandanachandran8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
